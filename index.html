<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>#ashtag - 라이더스 핫스팟</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { brand: { 50: '#f0fdf4', 500: '#22c55e', 600: '#16a34a', 700: '#15803d' } }
        }
      }
    }
  </script>
  <style>
    .logo-area {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      pointer-events: none;
    }
    .handwriting-logo {
      font-family: 'Caveat', cursive;
      font-size: 1.8rem;
      letter-spacing: -0.5px;
      pointer-events: auto;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 flex justify-center min-h-screen">

  <div class="w-full max-w-md bg-white dark:bg-gray-900 shadow-xl flex flex-col relative min-h-screen pb-20">
    
    <!-- Top Header -->
    <header class="sticky top-0 z-30 bg-white/80 dark:bg-gray-900/80 backdrop-blur-md border-b border-gray-100 dark:border-gray-800 px-4 h-14 flex items-center justify-between relative">
      <div class="flex items-center space-x-2">
        <button id="themeToggle" class="text-gray-600 dark:text-gray-300 hover:text-brand-600 transition">
          <i class="fa-solid fa-moon text-lg"></i>
        </button>
      </div>

      <div class="logo-area">
        <span class="handwriting-logo font-bold text-gray-900 dark:text-white">#ashtag</span>
      </div>

      <div class="flex items-center space-x-2">
        <button id="authBtn" onclick="handleAuthClick()" class="text-xs font-bold px-3 py-1.5 bg-brand-500 text-white rounded-full shadow-sm hover:bg-brand-600 transition">
          로그인
        </button>
      </div>
    </header>

    <!-- TAB 1: 🏠 홈 화면 -->
    <div id="tab-home" class="tab-content flex-1 flex flex-col overflow-y-auto">
      <div class="sticky top-0 z-20 bg-white dark:bg-gray-900 border-b border-gray-100 dark:border-gray-800 px-4 py-2 space-y-2">
        <div class="flex items-center justify-between">
          <div class="flex items-center space-x-1.5">
            <i class="fa-solid fa-location-dot text-brand-500 text-xs"></i>
            <select id="regionSelect" onchange="filterPosts()" class="text-xs font-bold bg-gray-100 dark:bg-gray-800 border-none rounded-lg px-2 py-1 outline-none cursor-pointer">
              <option value="all">🌐 전국 전체</option>
              <option value="seoul_gangnam">📍 서울 강남구</option>
              <option value="seoul_mapo">📍 서울 마포구</option>
              <option value="gyeonggi_suwon">📍 경기 수원시</option>
              <option value="gyeonggi_seongnam">📍 경기 성남시</option>
              <option value="incheon">📍 인천 전체</option>
              <option value="busan">📍 부산 전체</option>
            </select>
          </div>
          <span class="text-[10px] text-gray-400">실시간 지역 소통 중</span>
        </div>

        <div id="categoryContainer" class="flex space-x-2 text-xs font-medium whitespace-nowrap overflow-x-auto no-scrollbar pt-1">
          <button onclick="selectCategory('all')" class="category-btn px-3 py-1 bg-brand-500 text-white rounded-full font-bold">전체</button>
        </div>
      </div>

      <main class="flex-1 p-4 space-y-4">
        <div class="bg-gradient-to-r from-green-500 to-emerald-600 rounded-2xl p-4 text-white shadow-lg relative overflow-hidden">
          <h2 class="font-bold text-lg relative z-10">대한민국 배달 라이더 광장 🛵</h2>
          <p class="text-xs opacity-90 mt-1 relative z-10" id="bannerRegionText">전국 라이더 소통부터 내 동네 단가 소식까지!</p>
          <i class="fa-solid fa-motorcycle absolute -right-3 -bottom-3 text-6xl opacity-20"></i>
        </div>

        <div class="space-y-4" id="feedContainer">
          <p class="text-center text-xs text-gray-400 py-8">게시글을 불러오는 중입니다...</p>
        </div>
      </main>
    </div>

    <!-- TAB 2: 💬 광장 채팅 화면 -->
    <div id="tab-chat" class="tab-content flex-1 flex flex-col hidden h-[calc(100vh-7rem)]">
      <div class="bg-gray-100 dark:bg-gray-800 px-4 py-3 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between">
        <h3 class="font-bold text-xs flex items-center"><i class="fa-solid fa-comments text-brand-500 mr-2"></i> 전국 라이더 광장 실시간 채팅</h3>
        <span class="text-[10px] text-green-500 font-bold">● 실시간 연결됨</span>
      </div>
      <div id="chatMessages" class="flex-1 p-4 overflow-y-auto space-y-3 text-xs">
        <div class="text-center text-gray-400 py-4">채팅 내용을 불러오는 중...</div>
      </div>
      <div class="p-3 bg-white dark:bg-gray-900 border-t border-gray-100 dark:border-gray-800 flex items-center space-x-2">
        <label class="cursor-pointer text-gray-400 hover:text-brand-500 text-base px-1">
          <i class="fa-solid fa-image"></i>
          <input type="file" id="chatMediaInput" accept="image/*,video/*" class="hidden" onchange="sendChatMedia(this)">
        </label>
        <input type="text" id="chatInput" placeholder="메시지를 입력하세요..." onkeypress="if(event.key==='Enter') sendChatMessage()" class="flex-1 text-xs px-3 py-2 bg-gray-100 dark:bg-gray-700 rounded-xl outline-none">
        <button onclick="sendChatMessage()" class="px-4 py-2 bg-brand-500 text-white font-bold text-xs rounded-xl">전송</button>
      </div>
    </div>

    <!-- TAB 3: ➕ 글쓰기 화면 -->
    <div id="tab-write" class="tab-content flex-1 flex flex-col p-4 hidden space-y-4 overflow-y-auto">
      <div class="flex items-center justify-between border-b pb-3 dark:border-gray-800">
        <h3 class="font-bold text-sm">✍️ 새로운 소식 남기기</h3>
        <button onclick="switchTab('home')" class="text-xs text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-base"></i> 취소</button>
      </div>
      
      <div class="space-y-3 flex-1 flex flex-col">
        <textarea id="postContent" placeholder="수리점 추천, 실시간 단가, 도로 상황 등을 자유롭게 적어주세요!" class="w-full h-32 text-xs p-3 bg-gray-100 dark:bg-gray-700 rounded-xl outline-none focus:ring-1 focus:ring-brand-500 resize-none"></textarea>
        
        <!-- 미디어 첨부 영역 -->
        <div class="border-2 border-dashed border-gray-200 dark:border-gray-700 rounded-2xl p-4 text-center">
          <input type="file" id="postMediaInput" accept="image/*,video/*" class="hidden" onchange="previewPostMedia(this)">
          <div id="mediaPreviewArea" class="hidden relative mb-2">
            <img id="previewImg" class="max-h-40 mx-auto rounded-xl object-contain hidden">
            <video id="previewVideo" class="max-h-40 mx-auto rounded-xl object-contain hidden" controls></video>
            <button onclick="removeMedia()" class="absolute top-1 right-1 bg-black/60 text-white w-6 h-6 rounded-full text-xs flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
          </div>
          <button type="button" onclick="document.getElementById('postMediaInput').click()" class="text-xs text-gray-500 dark:text-gray-400 flex items-center justify-center mx-auto space-x-1 hover:text-brand-500">
            <i class="fa-solid fa-camera text-base"></i>
            <span>사진 또는 영상 첨부하기</span>
          </button>
        </div>

        <button onclick="submitPost()" class="w-full py-3 bg-brand-500 text-white font-bold text-xs rounded-xl shadow-sm hover:bg-brand-600 mt-auto">게시글 등록하기</button>
      </div>
    </div>

    <!-- TAB 4: 👤 내 정보 화면 -->
    <div id="tab-profile" class="tab-content flex-1 flex flex-col p-4 hidden space-y-4">
      <div class="bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700 rounded-2xl p-6 shadow-sm text-center">
        <div id="profileAvatar" class="w-16 h-16 bg-brand-50 text-brand-600 dark:bg-gray-700 dark:text-brand-400 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl font-bold">#</div>
        <h3 id="profileName" class="font-bold text-sm mb-1">로그인이 필요합니다</h3>
        <p id="profileEmail" class="text-xs text-gray-400 mb-4">구글 계정으로 로그인하여 활동해보세요.</p>
        <button id="profileAuthBtn" onclick="handleAuthClick()" class="px-6 py-2 bg-brand-500 text-white text-xs font-bold rounded-xl shadow-sm">로그인하기</button>
      </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="absolute bottom-0 left-0 right-0 h-16 bg-white dark:bg-gray-900 border-t border-gray-100 dark:border-gray-800 flex items-center justify-around px-2 z-30">
      <button onclick="switchTab('home')" id="nav-home" class="nav-btn flex flex-col items-center text-brand-600 dark:text-brand-400"><i class="fa-solid fa-house text-lg"></i><span class="text-[10px] mt-1 font-medium">홈</span></button>
      <button onclick="switchTab('chat')" id="nav-chat" class="nav-btn flex flex-col items-center text-gray-400 hover:text-gray-600"><i class="fa-solid fa-comments text-lg"></i><span class="text-[10px] mt-1">광장채팅</span></button>
      <button onclick="switchTab('write')" id="nav-write" class="nav-btn flex flex-col items-center text-gray-400 hover:text-gray-600"><i class="fa-solid fa-plus-circle text-lg"></i><span class="text-[10px] mt-1">글쓰기</span></button>
      <button onclick="switchTab('profile')" id="nav-profile" class="nav-btn flex flex-col items-center text-gray-400 hover:text-gray-600"><i class="fa-solid fa-user text-lg"></i><span class="text-[10px] mt-1">내정보</span></button>
    </nav>

    <!-- Login Modal -->
    <div id="loginModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
      <div class="bg-white dark:bg-gray-800 w-full max-w-sm rounded-3xl p-6 text-center shadow-2xl relative">
        <button onclick="closeModal('loginModal')" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
        <div class="w-12 h-12 bg-brand-50 dark:bg-gray-700 text-brand-600 dark:text-brand-400 rounded-2xl flex items-center justify-center mx-auto mb-4 text-xl font-bold">#</div>
        <h3 class="font-bold text-base mb-1">#ashtag 로그인</h3>
        <p class="text-xs text-gray-500 dark:text-gray-400 mb-6">구글 계정으로 간편하게 시작하세요!</p>
        <button onclick="loginWith('google')" class="w-full py-3 bg-white dark:bg-gray-700 text-gray-700 dark:text-gray-200 border border-gray-200 dark:border-gray-600 font-bold text-xs rounded-xl flex items-center justify-center space-x-2 shadow-sm">
          <i class="fa-brands fa-google text-red-500 text-base"></i><span>구글로 시작하기</span>
        </button>
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = 'https://ffeghqzayzvgrtmdlvlj.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZmZWdocXpheXp2Z3J0bWRsdmxqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwNjY1MzgsImV4cCI6MjEwNzY0MjUzOH0.wFm7T-6R6Nsce7GYafPgzAJCiyP95-zKc70QZDZS14s';
    
    let db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentUser = null;
    let activeCategory = 'all';
    let selectedFile = null;

    window.addEventListener('DOMContentLoaded', async () => {
      const { data: { user } } = await db.auth.getUser();
      currentUser = user;
      updateAuthUI();
      loadCategories();
      loadPosts();
      loadChatMessages();
      setupChatRealtime(); // 실시간 채팅 구독 시작
    });

    function switchTab(tabName) {
      if (tabName === 'write' && !currentUser) {
        openModal('loginModal');
        return;
      }
      
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById(`tab-${tabName}`).classList.remove('hidden');

      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('text-brand-600', 'dark:text-brand-400');
        btn.classList.add('text-gray-400');
      });
      document.getElementById(`nav-${tabName}`).classList.remove('text-gray-400');
      document.getElementById(`nav-${tabName}`).classList.add('text-brand-600', 'dark:text-brand-400');

      if (tabName === 'chat') {
        const chatBox = document.getElementById('chatMessages');
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }

    async function loginWith(provider) {
      await db.auth.signInWithOAuth({
        provider: provider,
        options: { redirectTo: window.location.origin }
      });
    }

    async function handleAuthClick() {
      if (currentUser) {
        await db.auth.signOut();
        location.reload();
      } else {
        openModal('loginModal');
      }
    }

    function updateAuthUI() {
      const btn = document.getElementById('authBtn');
      const profileName = document.getElementById('profileName');
      const profileEmail = document.getElementById('profileEmail');
      const profileAuthBtn = document.getElementById('profileAuthBtn');
      const profileAvatar = document.getElementById('profileAvatar');

      if (currentUser) {
        const name = currentUser.user_metadata?.full_name || currentUser.email.split('@')[0];
        btn.innerText = "로그아웃";
        btn.classList.replace('bg-brand-500', 'bg-gray-500');

        profileName.innerText = name;
        profileEmail.innerText = currentUser.email;
        profileAuthBtn.innerText = "로그아웃하기";
        profileAuthBtn.classList.replace('bg-brand-500', 'bg-red-500');
        profileAvatar.innerText = name.slice(0, 2);
      } else {
        btn.innerText = "로그인";
        btn.classList.replace('bg-gray-500', 'bg-brand-500');

        profileName.innerText = "로그인이 필요합니다";
        profileEmail.innerText = "구글 계정으로 로그인하여 활동해보세요.";
        profileAuthBtn.innerText = "로그인하기";
        profileAuthBtn.classList.replace('bg-red-500', 'bg-brand-500');
        profileAvatar.innerText = "#";
      }
    }

    // 파일 미리보기 처리
    function previewPostMedia(input) {
      if (input.files && input.files[0]) {
        selectedFile = input.files[0];
        const previewArea = document.getElementById('mediaPreviewArea');
        const img = document.getElementById('previewImg');
        const video = document.getElementById('previewVideo');
        const reader = new FileReader();

        previewArea.classList.remove('hidden');
        if (selectedFile.type.startsWith('image/')) {
          reader.onload = (e) => {
            img.src = e.target.result;
            img.classList.remove('hidden');
            video.classList.add('hidden');
          };
          reader.readAsDataURL(selectedFile);
        } else if (selectedFile.type.startsWith('video/')) {
          video.src = URL.createObjectURL(selectedFile);
          video.classList.remove('hidden');
          img.classList.add('hidden');
        }
      }
    }

    function removeMedia() {
      selectedFile = null;
      document.getElementById('postMediaInput').value = '';
      document.getElementById('mediaPreviewArea').classList.add('hidden');
      document.getElementById('previewImg').src = '';
      document.getElementById('previewVideo').src = '';
    }

    async function uploadFileToStorage(file) {
      const fileName = `${Date.now()}_${file.name}`;
      const { data, error } = await db.storage.from('media').upload(fileName, file);
      if (error) {
        alert("파일 업로드 실패: " + error.message);
        return null;
      }
      const { data: publicUrlData } = db.storage.from('media').getPublicUrl(fileName);
      return publicUrlData.publicUrl;
    }

    async function loadPosts() {
      const container = document.getElementById('feedContainer');
      const region = document.getElementById('regionSelect').value;
      let query = db.from('posts').select('*').order('created_at', { ascending: false });

      if (region !== 'all') query = query.eq('region_code', region);
      if (activeCategory !== 'all') query = query.eq('category_name', activeCategory);

      const { data, error } = await query;

      if (error || !data || data.length === 0) {
        container.innerHTML = `<p class="text-center text-xs text-gray-400 py-8">작성된 게시글이 없습니다. 첫 글을 남겨보세요!</p>`;
        return;
      }

      container.innerHTML = data.map(post => {
        let mediaTag = '';
        if (post.media_url) {
          if (post.media_url.match(/\.(mp4|webm|ogg)$/i) || post.media_url.includes('video')) {
            mediaTag = `<video src="${post.media_url}" controls class="w-full max-h-60 rounded-xl mb-3 object-cover"></video>`;
          } else {
            mediaTag = `<img src="${post.media_url}" class="w-full max-h-60 rounded-xl mb-3 object-cover" />`;
          }
        }

        return `
          <div class="bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700 rounded-2xl p-4 shadow-sm">
            <div class="flex items-center justify-between mb-3">
              <div class="flex items-center space-x-2">
                <div class="w-9 h-9 rounded-full bg-brand-50 text-brand-600 dark:bg-gray-700 dark:text-brand-400 flex items-center justify-center font-bold text-xs">
                  ${post.author_name ? post.author_name.slice(0, 2) : '라이더'}
                </div>
                <div>
                  <p class="text-xs font-bold">${post.author_name || '익명 라이더'}</p>
                  <p class="text-[10px] text-gray-400">${new Date(post.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</p>
                </div>
              </div>
              ${post.category_name ? `<span class="text-xs px-2 py-0.5 bg-brand-50 text-brand-600 dark:bg-gray-700 dark:text-brand-400 rounded-full font-medium">${post.category_name}</span>` : ''}
            </div>
            <p class="text-xs leading-relaxed mb-3">${post.content}</p>
            ${mediaTag}
          </div>
        `;
      }).join('');
    }

    async function submitPost() {
      if (!currentUser) return openModal('loginModal');
      const content = document.getElementById('postContent').value.trim();
      const region = document.getElementById('regionSelect').value;

      if (!content && !selectedFile) return alert("내용이나 미디어를 입력해주세요.");

      let mediaUrl = null;
      if (selectedFile) {
        mediaUrl = await uploadFileToStorage(selectedFile);
      }

      const { error } = await db.from('posts').insert([{
        content: content || '',
        region_code: region,
        author_name: currentUser.user_metadata?.full_name || currentUser.email.split('@')[0],
        user_id: currentUser.id,
        category_name: activeCategory === 'all' ? '자유게시판' : activeCategory,
        media_url: mediaUrl
      }]);

      if (error) {
        alert("글 작성 실패: " + error.message);
      } else {
        document.getElementById('postContent').value = '';
        removeMedia();
        switchTab('home');
        loadPosts();
      }
    }

    // 실시간 채팅 구독 설정 (Supabase Realtime)
    function setupChatRealtime() {
      db.channel('public:chats')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chats' }, payload => {
          loadChatMessages(); // 새로운 메시지가 들어오면 즉시 채팅창 새로고침
        })
        .subscribe();
    }

    // 채팅 미디어 전송
    async function sendChatMedia(input) {
      if (!currentUser) return openModal('loginModal');
      if (input.files && input.files[0]) {
        const file = input.files[0];
        const mediaUrl = await uploadFileToStorage(file);
        if (mediaUrl) {
          await db.from('chats').insert([{
            message: '사진/영상 첨부',
            media_url: mediaUrl,
            author_name: currentUser.user_metadata?.full_name || currentUser.email.split('@')[0],
            user_id: currentUser.id
          }]);
        }
      }
    }

    async function loadChatMessages() {
      const chatBox = document.getElementById('chatMessages');
      const { data, error } = await db.from('chats').select('*').order('created_at', { ascending: true }).limit(50);
      
      if (error || !data || data.length === 0) {
        chatBox.innerHTML = `<p class="text-center text-xs text-gray-400 py-4">아직 메시지가 없습니다. 첫 대화를 시작해보세요!</p>`;
        return;
      }

      chatBox.innerHTML = data.map(m => {
        let mediaContent = '';
        if (m.media_url) {
          mediaContent = `<img src="${m.media_url}" class="max-h-40 rounded-lg mt-2 object-cover" />`;
        }
        return `
          <div class="bg-gray-50 dark:bg-gray-800 p-2.5 rounded-xl border border-gray-100 dark:border-gray-700">
            <div class="flex justify-between items-center mb-1">
              <span class="font-bold text-brand-600 dark:text-brand-400">${m.author_name}</span>
              <span class="text-[9px] text-gray-400">${new Date(m.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
            </div>
            ${m.message && m.message !== '사진/영상 첨부' ? `<p class="text-gray-800 dark:text-gray-200">${m.message}</p>` : ''}
            ${mediaContent}
          </div>
        `;
      }).join('');
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendChatMessage() {
      if (!currentUser) return openModal('loginModal');
      const input = document.getElementById('chatInput');
      const msg = input.value.trim();
      if (!msg) return;

      const { error } = await db.from('chats').insert([{
        message: msg,
        author_name: currentUser.user_metadata?.full_name || currentUser.email.split('@')[0],
        user_id: currentUser.id
      }]);

      if (!error) {
        input.value = '';
        loadChatMessages(); // 내 화면에도 즉시 반영
      }
    }

    async function loadCategories() {
      let cats = [{ name: '자유게시판' }, { name: '실시간단가' }, { name: '수리정비' }, { name: '맛집쉼터' }];
      
      const { data } = await db.from('categories').select('*');
      if (data && data.length > 0) {
        cats = data.filter(c => c.name !== '전체');
      }

      const container = document.getElementById('categoryContainer');
      container.innerHTML = `<button onclick="selectCategory('all')" class="category-btn px-3 py-1 ${activeCategory === 'all' ? 'bg-brand-500 text-white font-bold' : 'bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300'} rounded-full whitespace-nowrap">전체</button>` +
        cats.map(c => `<button onclick="selectCategory('${c.name}')" class="category-btn px-3 py-1 ${activeCategory === c.name ? 'bg-brand-500 text-white font-bold' : 'bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300'} rounded-full whitespace-nowrap">${c.name}</button>`).join('');
    }

    function selectCategory(cat) {
      activeCategory = cat;
      loadCategories();
      loadPosts();
    }

    function filterPosts() { loadPosts(); }
    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    document.getElementById('themeToggle').addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
    });
  </script>
</body>
</html>
